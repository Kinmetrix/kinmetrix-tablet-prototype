<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kinmetrix prototypes</title>
  <style>
    :root {
      --page: #151515;
      --card: #1c1c1c;
      --line: #2a2a2a;
      --ink: #f3f3f3;
      --muted: #8d8d8d;
      --red: #e11d48;
      --icon-bg: #2a1218;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 72px 28px 80px;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    a.card {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 92px;
      padding: 20px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover,
    a.card:focus-visible {
      border-color: var(--red);
      outline: none;
    }
    .icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 10px;
      background: var(--icon-bg);
      color: var(--red);
      display: grid;
      place-items: center;
    }
    .icon svg {
      width: 22px;
      height: 22px;
    }
    .copy { flex: 1; min-width: 0; }
    .copy strong {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }
    .copy span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .chev {
      color: var(--muted);
      flex: 0 0 auto;
    }
    .chev svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    @media (max-width: 700px) {
      main { padding: 40px 18px 56px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Prototypes</h1>
    <div class="grid">
      <a class="card" href="experience/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <path d="M9 21h6" />
          </svg>
        </span>
        <span class="copy">
          <strong>Experience</strong>
          <span>Interactive landscape iPad exploration</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </span>
      </a>
      <a class="card" href="web/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="2" width="10" height="20" rx="2" />
            <path d="M11 18h2" />
          </svg>
        </span>
        <span class="copy">
          <strong>Web</strong>
          <span>Phone-width member web app</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </span>
      </a>
      <a class="card" href="oct13/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </span>
        <span class="copy">
          <strong>Oct 13</strong>
          <span>React clinic tablet prototype</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </span>
      </a>
      <a class="card" href="prototype/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
        </span>
        <span class="copy">
          <strong>Screens</strong>
          <span>HTML screen inventory</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7" />
          </svg>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
