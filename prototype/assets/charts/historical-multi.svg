    <g fill="#2e7d32">
      <polygon points="80,34 76,40 84,40"/>
      <polygon points="160,36 156,42 164,42"/>
      <polygon points="240,32 236,38 244,38"/>
      <polygon points="320,35 316,41 324,41"/>
      <polygon points="400,33 396,39 404,39"/>
      <polygon points="480,34 476,40 484,40"/>
      <polygon points="560,32 556,38 564,38"/>
