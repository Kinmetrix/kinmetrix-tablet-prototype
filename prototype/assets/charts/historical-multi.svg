    <line x1="640" y1="24" x2="640" y2="396" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="652" y="18" width="52" height="20" rx="4" fill="#d32f2f"/>
    <text x="678" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fff">12.0 KG</text>
  </g>
  <!-- Stability -->
  <g transform="translate(0 138)">
    <text x="8" y="18" font-family="system-ui,sans-serif" font-size="11" fill="#666">Stability</text>
    <text x="8" y="36" font-family="system-ui,sans-serif" font-size="9" fill="#999">100%</text>
    <text x="8" y="118" font-family="system-ui,sans-serif" font-size="9" fill="#999">0%</text>
    <rect x="56" y="24" width="640" height="100" fill="url(#grid)" stroke="#d8dee8"/>
    <polyline fill="none" stroke="#2e7d32" stroke-width="2"
