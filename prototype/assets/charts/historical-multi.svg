    </pattern>
  </defs>
  <!-- Avg Peak Force -->
  <g>
    <text x="8" y="18" font-family="system-ui,sans-serif" font-size="11" fill="#666">Avg Peak Force</text>
    <text x="8" y="36" font-family="system-ui,sans-serif" font-size="9" fill="#999">12.0 KG</text>
    <text x="8" y="118" font-family="system-ui,sans-serif" font-size="9" fill="#999">0.00 KG</text>
    <rect x="56" y="24" width="640" height="100" fill="url(#grid)" stroke="#d8dee8"/>
    <polyline fill="none" stroke="#d32f2f" stroke-width="2"
      points="80,95 160,88 240,92 320,85 400,90 480,82 560,78 640,30"/>
    <g fill="#d32f2f">
      <polygon points="80,95 76,101 84,101"/>
      <polygon points="160,88 156,94 164,94"/>
      <polygon points="240,92 236,98 244,98"/>
      <polygon points="320,85 316,91 324,91"/>
      <polygon points="400,90 396,96 404,96"/>
      <polygon points="480,82 476,88 484,88"/>
      <polygon points="560,78 556,84 564,84"/>
      <polygon points="640,30 636,36 644,36"/>
