    <text x="678" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fff">99%</text>
  </g>
  <!-- Symmetry -->
  <g transform="translate(0 276)">
    <text x="8" y="18" font-family="system-ui,sans-serif" font-size="11" fill="#666">Symmetry</text>
    <text x="8" y="36" font-family="system-ui,sans-serif" font-size="9" fill="#999">80%</text>
    <text x="8" y="118" font-family="system-ui,sans-serif" font-size="9" fill="#999">0%</text>
    <rect x="56" y="24" width="640" height="100" fill="url(#grid)" stroke="#d8dee8"/>
    <polyline fill="none" stroke="#ef6c00" stroke-width="2"
