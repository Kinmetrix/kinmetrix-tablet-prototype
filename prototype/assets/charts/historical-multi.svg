    <g fill="#ef6c00">
      <polygon points="80,70 76,76 84,76"/>
      <polygon points="160,55 156,61 164,61"/>
      <polygon points="240,62 236,68 244,68"/>
      <polygon points="320,48 316,54 324,54"/>
      <polygon points="400,58 396,64 404,64"/>
      <polygon points="480,52 476,58 484,58"/>
      <polygon points="560,60 556,66 564,66"/>
      <polygon points="640,72 636,78 644,78"/>
