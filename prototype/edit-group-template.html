<!DOCTYPE html>
<!-- route: EditGroupTemplate -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit group template · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="EditGroupTemplate" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="group-template-list.html">Back</a>
        <p class="route-chip">EditGroupTemplate <span class="stack-tag">team-settings</span></p>
        <h1>Edit group template</h1>
        <p class="enriched-meta">Header Save Changes updates template; success goes back.</p>
      </header>
      <main class="app__content">
        <div class="wire-toolbar">
          <div class="wire-toolbar__left"><a class="wire-toolbar-back" href="group-template-list.html">&lt; Back</a></div>
          <p class="wire-toolbar__title">Edit group template</p>
          <div class="wire-toolbar__right"><a class="wire-btn wire-btn--header" href="group-template-list.html">Save changes</a></div>
        </div>
        <div class="wire-center">
          <section class="wire-card wire-form-card" aria-label="Edit group template form">
          <h2 style="margin: 0 0 0.75rem; text-align: center">Edit group template</h2>
          <form class="wire-stack" action="group-template-list.html" method="get" style="max-width: 390px; margin-inline: auto">
            <div class="wire-field">
              <label for="edit-group-template-name">Name</label>
              <input
                id="edit-group-template-name"
                name="name"
                type="text"
                placeholder="Enter group template name"
                value="Warm-up block"
              />
            </div>
            <div class="wire-field">
              <label for="edit-group-template-desc">Description</label>
              <textarea
                id="edit-group-template-desc"
                name="description"
                rows="4"
                placeholder="Enter group template description"
                style="width: 100%; font: inherit; padding: 0.4rem 0.5rem; border: 1px solid #999; border-radius: 4px"
              >Isometric prep for varsity roster</textarea>
            </div>
</form>
        </section>
        </div>

        <nav class="flow-nav" aria-label="Edit group template flows" style="max-width: 520px; width: 100%">
          <h2>Cancel</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="group-template-list.html">Group template list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="step-template-list.html">Step template list</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
