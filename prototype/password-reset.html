<!DOCTYPE html>
<!-- source: src/features/auth/PasswordResetScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password reset · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="PasswordReset" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="password-login.html">Back</a>
        <p class="route-chip">PasswordReset <span class="stack-tag">app</span></p>
        <h1>Reset Password</h1>
        <p class="enriched-meta">Email field and send link. Second card shows success state in RN.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-center" style="min-height: auto; align-items: stretch; max-width: 420px; margin: 0 auto">
          <section class="wire-card" aria-label="Reset password form">
            <form class="wire-stack" action="#" method="get">
              <div class="wire-field">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" autocomplete="email" value="coach@example.com" />
              </div>
              <button class="wire-btn wire-btn--primary" type="submit">Send Reset Link</button>
            </form>
          </section>
          <section class="wire-card" aria-label="Reset link sent confirmation">
            <p><strong>Email sent</strong></p>
            <p>
              If an account exists with this email, we have sent a reset link. Check your inbox.
            </p>
            <a class="wire-btn wire-btn--ghost" href="password-login.html">Return to login</a>
          </section>
        </div>
        <nav class="flow-nav" aria-label="Auth flows">
          <h2>Related</h2>
          <ul>
            <li><a class="wire-btn" href="set-password.html">Set password (token link)</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="login.html">Login chooser</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
