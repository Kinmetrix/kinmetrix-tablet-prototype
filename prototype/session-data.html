<!DOCTYPE html>
<!-- source: src/features/session-details/screens/SessionDataScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session data · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="SessionData" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="session-history.html">Back</a>
        <p class="route-chip">SessionData <span class="stack-tag">user</span></p>
        <h1>Session data</h1>
        <p class="enriched-meta">SessionDataView list with angle pager and delete actions.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-toolbar">
          <button class="wire-btn wire-btn--ghost" type="button" aria-label="Previous angle">←</button>
          <div style="text-align: center">
            <p class="wire-toolbar__title">Isometric · Flexion</p>
            <button class="wire-btn wire-btn--ghost" type="button">0° ▾</button>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem">
            <span class="proto-avatar proto-avatar--fixture" data-default-avatar="Alex Morgan" data-avatar-size="48" style="width: 36px; height: 36px; font-size: 0.5rem"></span>
            <button class="wire-btn wire-btn--ghost" type="button" aria-label="Next angle">→</button>
          </div>
        </div>
        <aside class="enriched-meta" style="display: flex; gap: 1.5rem; flex-wrap: wrap">
          <span>Avg peak: <strong>142 N</strong></span>
          <span>Stability: <strong>94%</strong></span>
          <span>Target: <strong>40 N</strong></span>
        </aside>
        <table class="wire-table" aria-label="Recorded sessions">
          <thead>
            <tr>
              <th>Rep</th>
              <th>Peak (N)</th>
              <th>Completed</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>138</td>
              <td>Nov 8, 2026</td>
              <td><button class="wire-btn wire-btn--ghost" type="button">Delete</button></td>
            </tr>
            <tr>
              <td>2</td>
              <td>145</td>
              <td>Nov 8, 2026</td>
              <td><button class="wire-btn wire-btn--ghost" type="button">Delete</button></td>
            </tr>
            <tr>
              <td>3</td>
              <td>141</td>
              <td>Nov 8, 2026</td>
              <td><button class="wire-btn wire-btn--ghost" type="button">Delete</button></td>
            </tr>
          </tbody>
        </table>
        <nav class="flow-nav" aria-label="Session data flows">
          <h2>Angles &amp; history</h2>
          <ul>
            <li><a class="wire-btn" href="session-history.html">Session history</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="home.html">Home table link</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
