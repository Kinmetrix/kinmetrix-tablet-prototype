<!DOCTYPE html>
<!-- source: src/screens/GroupDataScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group data · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="GroupData" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="group-list.html">Back</a>
        <p class="route-chip">GroupData <span class="stack-tag">user</span></p>
        <h1>Group data</h1>
        <p class="enriched-meta">KMScreen without title in RN. Metric picker (sw) + RadialChart by SRA.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-toolbar">
          <span></span>
          <p class="wire-toolbar__title">Warm-up block</p>
          <button class="wire-btn wire-btn--ghost" type="button">Metric: Stable weight ▾</button>
        </div>
        <div class="wire-pane-fill" style="min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem">
          <div class="proto-chart" data-chart="radial" data-chart-label="radial label"></div>
          <p class="enriched-meta">Polar plot — angleKey from picker, radiusKey SRA.</p>
          <div
            style="
              width: 280px;
              height: 280px;
              border: 2px dashed #999;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 0.85rem;
              color: #666;
            "
          >
            Group SRA radar
          </div>
          <p class="enriched-meta">Picker options: Stable duration, Stable weight, Standard deviation.</p>
        </div>
        <nav class="flow-nav" aria-label="Group data flows">
          <h2>Related</h2>
          <ul>
            <li><a class="wire-btn" href="group-list.html">Group list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="group-results.html">Group results</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
