<!DOCTYPE html>
<!-- source: src/screens/AddGroupScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add new group · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="AddGroup" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="program-list.html">Back</a>
        <p class="route-chip">AddGroup <span class="stack-tag">user</span></p>
        <h1>Add new group</h1>
        <p class="enriched-meta">Creates group for active program; success replaces to Step list.</p>
      </header>
      <main class="app__content wire-center">
        <div class="wire-toolbar" style="max-width: 500px; width: 100%; margin-bottom: 0.5rem">
          <span></span>
          <p class="wire-toolbar__title">Add new group</p>
          <a class="wire-btn wire-btn--primary" href="step-list.html">Create group</a>
        </div>
        <section class="wire-card wire-form-card" aria-label="New group form">
          <h2 style="margin: 0 0 0.75rem">Create new group</h2>
          <form class="wire-stack" action="step-list.html" method="get">
            <div class="wire-field">
              <label for="group-name">Name</label>
              <input id="group-name" name="name" type="text" placeholder="Enter group name" value="" />
            </div>
            <div class="wire-field">
              <label for="group-desc">Description</label>
              <textarea
                id="group-desc"
                name="description"
                rows="4"
                placeholder="Enter group description"
                style="width: 100%; font: inherit; padding: 0.4rem 0.5rem; border: 1px solid #999; border-radius: 4px"
              ></textarea>
            </div>
            <button class="wire-btn wire-btn--primary" type="submit">Create group</button>
          </form>
        </section>
        <nav class="flow-nav" aria-label="Group flows" style="max-width: 500px; width: 100%">
          <h2>Next</h2>
          <ul>
            <li><a class="wire-btn" href="step-list.html">Step list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="group-list.html">Group list</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
