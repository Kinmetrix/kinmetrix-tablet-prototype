<!DOCTYPE html>
<!-- route: AddGroup -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Group · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="AddGroup" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="group-list.html">Back</a>
        <p class="route-chip">AddGroup <span class="stack-tag">user</span></p>
        <h1>Add New Group</h1>
        <p class="enriched-meta">Creates group for active program; success replaces to Step list.</p>
      </header>
      <main class="app__content">
        <div class="wire-toolbar">
          <div class="wire-toolbar__left"><a class="wire-toolbar-back" href="group-list.html">&lt; Back</a></div>
          <p class="wire-toolbar__title">Add New Group</p>
          <div class="wire-toolbar__right"><a class="wire-btn wire-btn--header" href="step-list.html">Create Group</a></div>
        </div>
        <div class="wire-center">
          <section class="wire-card wire-form-card" aria-label="New group form">
            <h2 style="margin: 0 0 0.75rem">Create New Group</h2>
            <form class="wire-stack" action="step-list.html" method="get">
              <div class="wire-field">
                <label for="group-name">Name</label>
                <input id="group-name" name="name" type="text" placeholder="Enter group name" value="" />
              </div>
              <div class="wire-field">
                <label for="group-desc">Description</label>
                <input id="group-desc" name="description" type="text" placeholder="Enter group description" value="" />
              </div>
            </form>
          </section>
        </div>
        <nav class="flow-nav" aria-label="Group flows">
          <h2>Next</h2>
          <ul>
            <li><a class="wire-btn" href="step-list.html">Step list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="group-list.html">Group list</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
