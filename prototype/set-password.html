<!DOCTYPE html>
<!-- source: src/features/auth/SetPasswordScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set password · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="SetPassword" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="index.html">All screens</a>
        <p class="route-chip">SetPassword <span class="stack-tag">app</span></p>
        <h1>Set password</h1>
        <p class="enriched-meta">Deep link with token validation. Success pops to root in RN.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-center" style="min-height: auto; align-items: stretch; max-width: 380px; margin: 0 auto">
          <section class="wire-card" aria-label="New password form">
            <form class="wire-stack" action="login.html" method="get">
              <div class="wire-field">
                <label for="password">New Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" value="" />
              </div>
              <div class="wire-field">
                <label for="confirm">Confirm Password</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" value="" />
              </div>
              <button class="wire-btn wire-btn--primary" type="submit">Set Password</button>
            </form>
          </section>
          <section class="wire-card" aria-label="Password reset successful">
            <p>Password reset successful</p>
            <a class="wire-btn wire-btn--primary" href="login.html">Continue</a>
          </section>
        </div>
        <nav class="flow-nav" aria-label="Auth flows">
          <h2>Related</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="password-reset.html">Request reset link</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="password-login.html">Log in</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
