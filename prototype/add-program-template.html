<!DOCTYPE html>
<!-- route: AddProgramTemplate -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Program Template · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="AddProgramTemplate" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="program-template-list.html">Back</a>
        <p class="route-chip">AddProgramTemplate <span class="stack-tag">team-settings</span></p>
        <h1>New Program Template</h1>
        <p class="enriched-meta">Header Create submits form; success replaces into group template list.</p>
      </header>
      <main class="app__content">
        <div class="wire-toolbar">
          <div class="wire-toolbar__left"><a class="wire-toolbar-back" href="program-template-list.html">&lt; Back</a></div>
          <p class="wire-toolbar__title">New Program Template</p>
          <div class="wire-toolbar__right"><a class="wire-btn wire-btn--header" href="group-template-list.html">Create</a></div>
        </div>
        <div class="wire-center">
          <section class="wire-card wire-form-card" aria-label="New program template form" style="width: 520px; max-width: 100%">
            <h2 style="margin: 0 0 0.75rem; text-align: center">Create New Program Template</h2>
            <form class="wire-stack" action="group-template-list.html" method="get" style="max-width: 390px; margin-inline: auto; width: 100%">
              <div class="wire-field">
                <label for="program-template-name">Name</label>
                <input
                  id="program-template-name"
                  name="name"
                  type="text"
                  placeholder="Enter program template name"
                  value=""
                />
              </div>
              <div class="wire-field">
                <label for="program-template-desc">Description</label>
                <input
                  id="program-template-desc"
                  name="description"
                  type="text"
                  placeholder="Enter program template description"
                  value=""
                />
              </div>
            </form>
          </section>
        </div>
        <nav class="flow-nav" aria-label="Program template flows">
          <h2>Cancel</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="program-template-list.html">Program template list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="team-settings-home.html">Team settings home</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
