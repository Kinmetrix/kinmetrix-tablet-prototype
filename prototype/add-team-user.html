<!DOCTYPE html>
<!-- route: AddTeamUser -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add team user · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
    <style>
      .add-team-user-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 480px;
        padding-top: 4px;
        align-self: flex-start;
      }
      .add-team-user-form .wire-field {
        max-width: none;
      }
      .add-team-user-form .wire-field input[type='text'],
      .add-team-user-form .wire-field input[type='email'] {
        border-radius: 6px;
        border-color: #d5d5d5;
      }
      .add-team-user-form__operator {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
      }
      .add-team-user-form__operator label {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .add-team-user-form__submit {
        width: 100%;
        min-height: 44px;
        background: #111;
        border-color: #111;
        border-radius: 8px;
        color: #fff;
        font-weight: 600;
      }
      .add-team-user-form__switch {
        width: 3rem;
        height: 1.75rem;
        border-radius: 999px;
        border: 0;
        background: #cfcfd4;
        position: relative;
        cursor: pointer;
      }
      .add-team-user-form__switch::after {
        content: '';
        position: absolute;
        top: 0.2rem;
        left: 0.2rem;
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
      }
    </style>
  </head>
  <body data-route="AddTeamUser" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="team-user-list.html">Back</a>
        <p class="route-chip">AddTeamUser <span class="stack-tag">team-settings</span></p>
        <h1>Add New Team Member</h1>
        <p class="enriched-meta">Orphaned in live nav (no navigate to AddTeamUser); form mirrors AddTeamUserScreen.</p>
      </header>
      <main class="app__content">
        <div class="wire-toolbar">
          <div class="wire-toolbar__left"><a class="wire-toolbar-back" href="team-user-list.html">&lt; Back</a></div>
          <p class="wire-toolbar__title">Add New Team Member</p>
          <div class="wire-toolbar__right"></div>
        </div>
        <form class="add-team-user-form" action="team-user-list.html" method="get">
          <div class="wire-field">
            <label for="member-name">Name</label>
            <input id="member-name" name="name" type="text" placeholder="Enter name" value="" />
          </div>
          <div class="wire-field">
            <label for="member-email">Email</label>
            <input id="member-email" name="email" type="email" placeholder="member@example.com" value="" autocomplete="email" />
          </div>
          <div class="add-team-user-form__operator">
            <label for="member-operator">Make Operator</label>
            <button class="add-team-user-form__switch" id="member-operator" type="button" role="switch" aria-checked="false" aria-label="Make Operator"></button>
          </div>
          <button class="wire-btn wire-btn--primary add-team-user-form__submit" type="submit">Add User</button>
        </form>
        <nav class="flow-nav" aria-label="Add team user flows">
          <h2>Related</h2>
          <ul>
            <li><a class="wire-btn" href="team-user-list.html">Team user list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="column-management.html">Manage columns</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="team-user-details.html">Team user details</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
