<!DOCTYPE html>
<!-- source: src/screens/TeamUserDetailsScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alex Morgan's details · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="TeamUserDetails" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="team-user-list.html">Back</a>
        <p class="route-chip">TeamUserDetails <span class="stack-tag">team-settings</span></p>
        <h1>Alex Morgan's details</h1>
        <p class="enriched-meta">Operator toggles and remove user; Save in header when dirty.</p>
      </header>
      <main class="app__content wire-center">
        <section class="wire-card wire-form-card" style="max-width: 420px; width: 100%" aria-label="Team user settings">
          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem">
            <span
              class="proto-avatar proto-avatar--fixture"
              data-default-avatar="Alex Morgan"
              data-avatar-size="56"
              style="width: 56px; height: 56px"
            ></span>
            <div>
              <p style="margin: 0; font-weight: 600">Alex Morgan</p>
              <p class="enriched-meta" style="margin: 0">alex.morgan@example.com</p>
            </div>
          </div>
          <div class="wire-field" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd">
            <label for="tu-operator">Is operator</label>
            <input id="tu-operator" type="checkbox" aria-label="Is operator" />
          </div>
          <div class="wire-field" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd">
            <label for="tu-archived">Archive user</label>
            <input id="tu-archived" type="checkbox" aria-label="Archive user" />
          </div>
          <div class="wire-field" style="padding-top: 1rem">
            <p class="enriched-meta" style="margin: 0 0 0.5rem">Team access</p>
            <button class="wire-btn" type="button" style="border-color: #c33; color: #c33">Remove user</button>
          </div>
          <button class="wire-btn wire-btn--primary" type="button" style="margin-top: 1rem; width: 100%">Save</button>
        </section>
        <nav class="flow-nav" aria-label="Team user details flows" style="max-width: 420px; width: 100%">
          <h2>Related</h2>
          <ul>
            <li><a class="wire-btn" href="team-user-list.html">Back to list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="team-user.html">Team user profile</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
