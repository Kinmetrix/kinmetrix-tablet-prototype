<!DOCTYPE html>
<!-- source: src/screens/AddStepScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add new step · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="AddStep" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="step-list.html">Back</a>
        <p class="route-chip">AddStep <span class="stack-tag">user</span></p>
        <h1>Add new step</h1>
        <p class="enriched-meta">CardButton grid opens EditStepPopovers in RN; submit creates step for group.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-toolbar">
          <span></span>
          <p class="wire-toolbar__title">Add new step</p>
          <a class="wire-btn wire-btn--primary" href="step-list.html">Create step</a>
        </div>
        <section class="wire-card" aria-label="Step properties">
          <h2 style="margin: 0 0 0.25rem">Step properties</h2>
          <p class="enriched-meta">Configure the properties of the new step.</p>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 0.75rem;
              margin-top: 1rem;
            "
          >
            <button class="wire-kv-row" type="button">
              <span>Mode</span>
              <strong>Isometric</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Duration</span>
              <strong>5s</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Tilt</span>
              <strong>1°</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Target weight</span>
              <strong>3 N</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Rotation</span>
              <strong>0°</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Repetitions</span>
              <strong>3</strong>
            </button>
          </div>
        </section>
        <nav class="flow-nav" aria-label="Add step flows">
          <h2>After save</h2>
          <ul>
            <li><a class="wire-btn" href="step-list.html">Step list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="group-list.html">Group list</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
