<!DOCTYPE html>
<!-- source: src/screens/EditStepTemplateScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit step template · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="EditStepTemplate" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="step-template-list.html">Back</a>
        <p class="route-chip">EditStepTemplate <span class="stack-tag">team-settings</span></p>
        <h1>Edit step template</h1>
        <p class="enriched-meta">Name card plus property grid; Save Changes returns to list.</p>
      </header>
      <main class="app__content wire-stack">
        <section class="wire-card wire-form-card" aria-label="Step template name">
          <div class="wire-field">
            <label for="edit-step-template-name">Name</label>
            <input
              id="edit-step-template-name"
              name="name"
              type="text"
              placeholder="Enter template name"
              value="Flexion 0° isometric"
            />
          </div>
        </section>
        <section class="wire-card" aria-label="Template properties">
          <h2 style="margin: 0 0 0.25rem">Template properties</h2>
          <p class="enriched-meta">Configure the properties of this step template.</p>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 0.75rem;
              margin-top: 1rem;
            "
          >
            <button class="wire-kv-row" type="button">
              <span>Mode</span>
              <strong>Isometric</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Duration</span>
              <strong>10s</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Tilt</span>
              <strong>0°</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Target weight</span>
              <strong>35 N</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Rotation</span>
              <strong>0°</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Repetitions</span>
              <strong>3</strong>
            </button>
            <button class="wire-kv-row" type="button">
              <span>Weight %</span>
              <strong>Not set</strong>
            </button>
          </div>
          <p style="margin-top: 1rem">
            <a class="wire-btn wire-btn--primary" href="step-template-list.html">Save changes</a>
          </p>
        </section>
        <nav class="flow-nav" aria-label="Edit step template flows">
          <h2>Cancel</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="step-template-list.html">Step template list</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="add-step-template.html">Add step template</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
