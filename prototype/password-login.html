<!DOCTYPE html>
<!-- source: src/features/auth/PasswordLoginScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password login · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="PasswordLogin" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="login.html">Back</a>
        <p class="route-chip">PasswordLogin <span class="stack-tag">app</span></p>
        <h1>Log in</h1>
        <p class="enriched-meta">Fixture credentials only. Submit goes to member home.</p>
      </header>
      <main class="app__content wire-stack">
        <div class="wire-center" style="min-height: auto">
          <img class="kin-logo kin-logo--mark" src="assets/kinmetrix-logo.svg" alt="" style="width: 72px; height: 72px; font-size: 0.65rem" />
          <p><strong>Log in to Kinmetrix</strong></p>
        </div>
        <form class="wire-stack" action="home.html" method="get">
          <div class="wire-field">
            <label for="identifier">Email Address</label>
            <input id="identifier" name="identifier" type="email" autocomplete="email" value="coach@example.com" />
          </div>
          <div class="wire-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" value="••••••" />
          </div>
          <button class="wire-btn wire-btn--primary" type="submit">Log In</button>
        </form>
        <nav class="flow-nav" aria-label="Prototype shortcuts">
          <h2>Other auth screens</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="password-reset.html">Forgot password</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="set-password.html">Set password (deep link)</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
