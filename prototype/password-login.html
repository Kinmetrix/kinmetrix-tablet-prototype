<!DOCTYPE html>
<!-- route: PasswordLogin -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password login · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="PasswordLogin" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="login.html">Back</a>
        <p class="route-chip">PasswordLogin <span class="stack-tag">app</span></p>
        <h1>Log in</h1>
        <p class="enriched-meta">Fixture credentials only. Submit goes to member home.</p>
      </header>
      <main class="app__content login-shell">
        <a class="login-shell__back" href="login.html">&lt; Back</a>
        <form class="login-card" action="home.html" method="get">
          <img
            class="kin-logo kin-logo--mark"
            src="assets/kinmetrix-logo.svg"
            alt=""
            style="width: 40px; height: 40px"
          />
          <h1 class="login-card__title">Log in to Kinmetrix</h1>
          <div class="wire-field">
            <label for="identifier">Email Address</label>
            <div class="wire-field__control">
              <svg class="wire-field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <input
                id="identifier"
                name="identifier"
                type="email"
                autocomplete="email"
                value="coach@example.com"
              />
            </div>
          </div>
          <div class="wire-field">
            <label for="password">Password</label>
            <div class="wire-field__control">
              <svg class="wire-field__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5.5" y="11" width="13" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M8 11V8.2a4 4 0 0 1 8 0V11" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                value="password"
              />
            </div>
          </div>
          <button class="wire-btn wire-btn--primary" type="submit">Log In</button>
        </form>
        <nav class="flow-nav" aria-label="Prototype shortcuts">
          <h2>Other auth screens</h2>
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="password-reset.html">Forgot password</a></li>
            <li><a class="wire-btn wire-btn--ghost" href="set-password.html">Set password (deep link)</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
