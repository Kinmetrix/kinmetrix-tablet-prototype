<!DOCTYPE html>
<!-- source: src/screens/onboarding/HandScreen.tsx -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dominant hand · Kinmetrix prototype</title>
    <link rel="stylesheet" href="kin-prototype.css" />
  </head>
  <body data-route="OnboardingHand" data-enriched="true">
    <div class="device-frame">
      <header class="screen-header">
        <a class="back-link" href="onboarding-position.html">Back</a>
        <p class="route-chip">OnboardingHand <span class="stack-tag">onboarding-step</span></p>
        <h1>Hand</h1>
      </header>
      <main class="app__content wire-center">
        <div class="wire-toolbar" style="max-width: 480px; width: 100%">
          <a class="wire-btn wire-btn--ghost" href="onboarding.html">✕</a>
          <p class="wire-toolbar__title">Step 8 of 11 · Hand</p>
        </div>
        <section class="wire-card wire-form-card" style="max-width: 480px; width: 100%">
          <h2 style="margin: 0 0 1rem; text-align: center">What's your dominant hand?</h2>
          <div class="wire-segmented" role="group" aria-label="Dominant hand">
            <span class="is-active">Right</span>
            <span>Left</span>
            <span>Ambidextrous</span>
          </div>
          <p style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap">
            <a class="wire-btn wire-btn--primary" href="onboarding-competition-level.html">Next</a>
            <a class="wire-btn wire-btn--ghost" href="onboarding-competition-level.html">Skip</a>
          </p>
        </section>
        <nav class="flow-nav" aria-label="Onboarding hand flows" style="max-width: 480px; width: 100%">
          <ul>
            <li><a class="wire-btn wire-btn--ghost" href="onboarding-position.html">Previous</a></li>
            <li><a class="wire-btn wire-btn--primary" href="onboarding-competition-level.html">Next</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
