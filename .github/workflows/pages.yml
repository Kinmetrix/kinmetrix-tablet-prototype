name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site root from prototype/
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude 'scripts' \
            --exclude '_tmp*' \
            --exclude 'package.json' \
            --exclude 'yarn.lock' \
            prototype/ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          ls -la _site | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
